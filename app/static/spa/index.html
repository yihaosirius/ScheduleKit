<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：iPhone 刘海屏下允许内容延伸到安全区，
         配合 CSS 的 env(safe-area-inset-*) 才能做真正的全屏布局 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="description" content="围绕学业构建的待办事项系统：有序表 / 无序表、拍照录入、课表上下文" />

    <!-- 添加到主屏幕后的表现。
         `apple-mobile-web-app-capable` 已被 Chrome 标为 deprecated（控制台会
         警告），标准名是 `mobile-web-app-capable`；但 **iOS 至今只认 apple- 那个**。
         所以两个都留：只留标准名会让 iOS 上看起来像普通书签，
         只留 apple 名则会在 Chrome 里刷警告。 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ScheduleKit" />
    <meta name="theme-color" content="#1c1e21" />

    <link rel="manifest" href="/manifest.webmanifest" />

</html>
